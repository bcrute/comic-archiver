import groovy.json.JsonOutput
import org.gradle.api.artifacts.DependencyResolutionListener
import org.gradle.api.artifacts.ResolvableDependencies
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.result.ResolvedDependencyResult
import org.gradle.api.artifacts.result.UnresolvedDependencyResult

// Register before settings and plugin scripts resolve their own configurations.
def inventory = new File(System.getenv('RELEASE_GRADLE_INVENTORY'))
def writeLock = new Object()
gradle.addListener(new DependencyResolutionListener() {
    @Override
    void beforeResolve(ResolvableDependencies dependencies) {}

    @Override
    void afterResolve(ResolvableDependencies dependencies) {
        def result = dependencies.resolutionResult
        // Script classpaths can report a synthetic, module-shaped root. Only
        // selected dependency edges represent modules Gradle actually resolved.
        def modules = result.allDependencies.findAll {
            it instanceof ResolvedDependencyResult
        }.collect { it.selected.id }.findAll {
            it instanceof ModuleComponentIdentifier
        }.collect { [it.group, it.module, it.version] }.unique()
        def path = dependencies.path
        def entry = JsonOutput.toJson([
            configuration: path.startsWith(':') ? path : ':' + path,
            modules: modules,
            unresolved: result.allDependencies.count { it instanceof UnresolvedDependencyResult },
        ])
        synchronized (writeLock) {
            inventory.append(entry + '\n', 'UTF-8')
        }
    }
})
