# Builds and automated suites run on the project's own build machines. GitHub only publishes their attested downloads.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Verify fleet evidence and publish staged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          OWNER: ${{ github.repository_owner }}
          REF_TYPE: ${{ github.ref_type }}
          # The Android release key's public certificate; the repository variable, when set, takes its place.
          ANDROID_RELEASE_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 || '9196fb0c14a00d2516f8ad79cad12d5b8c7593c254d623367ed1182044b51099' }}
        run: |
          set -euo pipefail
          # The APK is checked with the Android SDK's own tools; install them when the runner lacks this version.
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if ! test -x "$sdk/build-tools/37.0.0/apksigner"; then
            (yes || true) | "$sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" "build-tools;37.0.0" > /dev/null
          fi
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$REF_TYPE" = tag
          test "$RELEASE_TAG" = "v$version"
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          mkdir dist
          gh release download "$RELEASE_TAG" --dir dist
          release_api=$(gh release view "$RELEASE_TAG" --json apiUrl --jq .apiUrl)
          gh api "$release_api" > release.json
          python3 scripts/verify_release.py dist --commit "$COMMIT" --release release.json --owner "$OWNER" \
            --android-cert-sha256 "$ANDROID_RELEASE_CERT_SHA256" \
            --android-build-tools "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/37.0.0"
          if test "$(python3 -c 'import json; print(json.load(open("release.json"))["prerelease"])')" = True; then
            gh release edit "$RELEASE_TAG" --draft=false --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi

  website:
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/website.yml
