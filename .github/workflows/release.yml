# Builds and automated suites run on the project's own build machines. GitHub only publishes their attested downloads.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing qualified release tag to retry (for example v0.5.5)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release-ref.outputs.tag }}
    steps:
      - name: Resolve release tag
        id: release-ref
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$EVENT_NAME" = workflow_dispatch || test "$REF_TYPE" = tag
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ steps.release-ref.outputs.tag }}
      - name: Verify fleet evidence and publish staged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release-ref.outputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_COMMIT: ${{ github.sha }}
          OWNER: ${{ github.repository_owner }}
          ANDROID_BUILD_TOOLS_VERSION: '35.0.0'
          # The Android release key's public certificate; the repository variable, when set, takes its place.
          ANDROID_RELEASE_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 || '9196fb0c14a00d2516f8ad79cad12d5b8c7593c254d623367ed1182044b51099' }}
        run: |
          set -euo pipefail
          # Match the SDK used during fleet signing and verification.
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          tools="$sdk/build-tools/$ANDROID_BUILD_TOOLS_VERSION"
          if ! test -x "$tools/apksigner"; then
            (yes || true) | "$sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" "build-tools;$ANDROID_BUILD_TOOLS_VERSION" > /dev/null
          fi
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          commit=$(git rev-parse HEAD)
          test "$EVENT_NAME" = workflow_dispatch || test "$commit" = "$EVENT_COMMIT"
          test "$RELEASE_TAG" = "v$version"
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          mkdir dist
          gh release download "$RELEASE_TAG" --dir dist
          release_api=$(gh release view "$RELEASE_TAG" --json apiUrl --jq .apiUrl)
          gh api "$release_api" > release.json
          python3 scripts/verify_release.py dist --commit "$commit" --release release.json --owner "$OWNER" \
            --android-cert-sha256 "$ANDROID_RELEASE_CERT_SHA256" \
            --android-build-tools "$tools"
          if test "$(python3 -c 'import json; print(json.load(open("release.json"))["prerelease"])')" = True; then
            gh release edit "$RELEASE_TAG" --draft=false --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi

  website:
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/website.yml
    with:
      ref: refs/tags/${{ needs.publish.outputs.tag }}
