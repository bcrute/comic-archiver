# Builds and automated suites run on Core/Heavy. GitHub only publishes their attested downloads.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      statuses: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify fleet evidence and publish staged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          OWNER: ${{ github.repository_owner }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$REF_TYPE" = tag
          test "$RELEASE_TAG" = "v$version"
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          mkdir dist
          gh release download "$RELEASE_TAG" --dir dist
          gh api "repos/$GH_REPO/commits/$COMMIT/status" > statuses.json
          python3 scripts/verify_release.py dist --commit "$COMMIT" --statuses statuses.json --owner "$OWNER"
          gh release edit "$RELEASE_TAG" --draft=false --latest
